<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - D2C Pulse Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'IBM Plex Mono', monospace;
            background: #f4f4f2;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box {
            background: #fff; border: 1px solid #1a1a1a; padding: 36px 34px;
            width: 300px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            opacity: 0; animation: riseIn 0.5s ease-out forwards;
        }
        h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        p.sub { font-size: 11px; color: #6b6b64; margin-bottom: 20px; }
        input {
            width: 100%; padding: 10px 12px; margin: 6px 0;
            border: 1px solid #ccc; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
        }
        input:focus { outline: none; border-color: #1a1a1a; }
        button {
            width: 100%; padding: 11px; background: #1a1a1a; color: #e8e825;
            border: none; font-weight: 600; font-size: 12px; letter-spacing: 0.5px;
            cursor: pointer; margin-top: 10px; transition: background 0.15s ease;
        }
        button:hover { background: #333; }
        .errorlist { color: #c0392b; list-style: none; padding: 0; font-size: 11px; text-align: left; }
        .links { margin-top: 18px; font-size: 11px; text-align: center; }
        .links a { color: #1a1a1a; font-weight: 600; text-decoration: none; border-bottom: 1px solid #e8e825; }
        .back { margin-top: 10px; text-align: center; }
        .back a { color: #a0a09a; text-decoration: none; font-size: 11px; }
        .back a:hover { color: #1a1a1a; }
        @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="box">
        <h2>CREATE ACCOUNT</h2>
        <p class="sub">Start tracking your competitors today</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">SIGN UP</button>
        </form>
        <div class="links">Already have an account? <a href="{% url 'login' %}">LOGIN</a></div>
        <div class="back"><a href="{% url 'home' %}">&larr; Back to Home</a></div>
    </div>
</body>
</html>
