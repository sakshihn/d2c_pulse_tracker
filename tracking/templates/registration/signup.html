<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - D2C Pulse Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f7f0e8;
            color: #2b2b2b;
        }
        .login-box {
            background: white;
            padding: 45px 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(232,138,179,0.2);
            width: 320px;
            text-align: center;
            opacity: 0;
            animation: riseIn 0.6s ease-out forwards;
        }
        h2 {
            font-family: 'Fredoka', sans-serif;
            color: #e88ab3;
            font-size: 28px;
            margin-bottom: 6px;
        }
        p.sub { font-family: 'Playfair Display', serif; font-style: italic; color: #777; font-size: 14px; margin-bottom: 22px; }
        input {
            width: 100%;
            padding: 11px 14px;
            margin: 8px 0;
            border: 1.5px solid #eee0d8;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: border 0.2s ease;
        }
        input:focus { outline: none; border-color: #e88ab3; }
        button {
            width: 100%;
            padding: 12px;
            background: #e88ab3;
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        button:hover { background: #d9709f; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(232,138,179,0.4); }
        .errorlist { color: #d9534f; list-style: none; padding: 0; font-size: 13px; text-align: left; }
        .links { margin-top: 20px; font-size: 13px; }
        .links a { color: #e88ab3; text-decoration: none; font-weight: 600; }
        .links a:hover { text-decoration: underline; }
        .back { margin-top: 10px; }
        .back a { color: #999; text-decoration: none; font-size: 13px; }
        .back a:hover { text-decoration: underline; }
        @keyframes riseIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Create Account</h2>
        <p class="sub">Start tracking your competitors today</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
        </form>
        <div class="links">
            Already have an account? <a href="{% url 'login' %}">Login</a>
        </div>
        <div class="back">
            <a href="{% url 'home' %}">&larr; Back to Home</a>
        </div>
    </div>
</body>
</html>
