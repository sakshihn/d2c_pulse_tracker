<!DOCTYPE html>
<html>
<head>
    <title>Login - D2C Pulse Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'IBM Plex Mono', monospace;
            background: #efefec;
            background-image: radial-gradient(#00000010 1.5px, transparent 1.5px);
            background-size: 22px 22px;
            animation: driftGrid 30s linear infinite;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        @keyframes driftGrid {
            from { background-position: 0 0; }
            to { background-position: 220px 220px; }
        }
        .box {
            background: #fff; border: 1px solid #1a1a1a; padding: 36px 34px;
            width: 360px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            opacity: 0; animation: riseIn 0.5s ease-out forwards;
        }
        @keyframes driftGrid { from { background-position: 0 0; } to { background-position: 220px 220px; } }
        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #e8e82560, transparent); animation: scan 6s linear infinite; z-index: -1; }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
        .blip { position: fixed; bottom: -20px; width: 5px; height: 5px; background: #e8e825; opacity: 0; animation: blipRise 8s linear infinite; z-index: -1; }
        @keyframes blipRise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.3; } 100% { transform: translateY(-100vh); opacity: 0; } }
        h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        p.sub { font-size: 11px; color: #6b6b64; margin-bottom: 20px; }
        input {
            width: 100%; padding: 10px 12px; margin: 6px 0;
            border: 1px solid #ccc; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
        }
        input:focus { outline: none; border-color: #1a1a1a; }
        button {
            width: 100%; padding: 11px; background: #1a1a1a; color: #e8e825;
            border: none; font-weight: 600; font-size: 12px; letter-spacing: 0.5px;
            cursor: pointer; margin-top: 10px; transition: background 0.15s ease;
        }
        button:hover { background: #333; }
        .errorlist { color: #c0392b; list-style: none; padding: 0; font-size: 11px; text-align: left; }
        .links { margin-top: 18px; font-size: 11px; text-align: center; }
        .links a { color: #1a1a1a; font-weight: 600; text-decoration: none; border-bottom: 1px solid #e8e825; }
        .back { margin-top: 10px; text-align: center; }
        .back a { color: #a0a09a; text-decoration: none; font-size: 11px; }
        .back a:hover { color: #1a1a1a; }
        @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div class="blip" style="left:20%; animation-delay:0s;"></div>
    <div class="blip" style="left:55%; animation-delay:3s;"></div>
    <div class="blip" style="left:80%; animation-delay:1.5s;"></div>
    <div class="box">
        <h2>WELCOME BACK</h2>
        <p class="sub">Log in to track your competition</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">LOGIN</button>
        </form>
        <div class="links">Don't have an account? <a href="{% url 'signup' %}">SIGN UP</a></div>
        <div class="back"><a href="{% url 'home' %}">&larr; Back to Home</a></div>
    </div>
</body>
</html>
