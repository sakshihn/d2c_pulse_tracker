<!DOCTYPE html>
<html>
<head>
    <title>D2C Pulse Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'IBM Plex Mono', monospace;
            background: #efefec;
            background-image: radial-gradient(#00000010 1.5px, transparent 1.5px);
            background-size: 22px 22px;
            animation: driftGrid 30s linear infinite;
            color: #1a1a1a;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        @keyframes driftGrid { from { background-position: 0 0; } to { background-position: 220px 220px; } }
        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, #e8e82560, transparent); animation: scan 6s linear infinite; z-index: 0; }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
        .blip { position: fixed; bottom: -20px; width: 5px; height: 5px; background: #e8e825; opacity: 0; animation: blipRise 8s linear infinite; }
        @keyframes blipRise { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.3; } 100% { transform: translateY(-100vh); opacity: 0; } }
        .about-link {
            position: absolute; top: 22px; right: 26px;
            font-size: 11px; letter-spacing: 0.5px; font-weight: 600;
            color: #1a1a1a; text-decoration: none;
            padding: 8px 16px; border: 1px solid #1a1a1a;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .about-link:hover { background: #1a1a1a; color: #e8e825; }
        .content { text-align: center; opacity: 0; animation: riseIn 0.6s ease-out 0.1s forwards; }
        h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
        h1 span { color: #1a1a1a; border-bottom: 3px solid #e8e825; }
        .tagline { font-size: 13px; color: #6b6b64; margin-bottom: 32px; letter-spacing: 0.3px; }
        .btns a {
            display: inline-block; margin: 0 6px; padding: 12px 28px;
            text-decoration: none; font-size: 12px; letter-spacing: 0.5px; font-weight: 600;
            transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
        }
        .btns a.primary { background: #1a1a1a; color: #e8e825; }
        .btns a.primary:hover { background: #333; transform: translateY(-2px); }
        .btns a.secondary { background: transparent; color: #1a1a1a; border: 1px solid #1a1a1a; }
        .btns a.secondary:hover { background: #1a1a1a; color: #fff; transform: translateY(-2px); }
        .about { position: absolute; bottom: 22px; font-size: 11px; color: #a0a09a; }
        @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div class="blip" style="left:15%; animation-delay:0s;"></div>
    <div class="blip" style="left:40%; animation-delay:3s;"></div>
    <div class="blip" style="left:70%; animation-delay:1.5s;"></div>
    <div class="blip" style="left:88%; animation-delay:4.5s;"></div>
    <a href="{% url 'about_builder' %}" class="about-link">MEET THE BUILDER</a>
    <div class="content">
        <h1>D2C <span>PULSE</span> TRACKER</h1>
        <div class="tagline">COMPETITIVE PRICING INTELLIGENCE FOR D2C BEAUTY BRANDS</div>
        <div class="btns">
            <a href="{% url 'login' %}" class="primary">LOGIN</a>
            <a href="{% url 'signup' %}" class="secondary">SIGN UP</a>
        </div>
    </div>
    <div class="about">Built by Sakshi ❤️</div>
</body>
</html>
