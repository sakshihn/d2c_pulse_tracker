<!DOCTYPE html>
<html>
<head>
    <title>D2C Pulse Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        h1 { font-size: 42px; margin-bottom: 10px; animation: fadeIn 1s ease-in; }
        p { font-size: 18px; margin-bottom: 30px; opacity: 0.9; }
        a {
            display: inline-block;
            margin: 10px;
            padding: 14px 28px;
            background: white;
            color: #764ba2;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <h1>D2C Pulse Tracker</h1>
    <p>Competitive pricing intelligence for D2C beauty brands</p>
    <div>
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'signup' %}">Sign Up</a>
    </div>
</body>
</html>
