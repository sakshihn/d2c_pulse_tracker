<!DOCTYPE html>
<html>
<head>
    <title>About the Builder - D2C Pulse Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'IBM Plex Mono', monospace;
            background: #f4f4f2;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .box {
            background: #fff; border: 1px solid #1a1a1a; padding: 38px 34px;
            max-width: 420px; width: 100%; text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            opacity: 0; animation: riseIn 0.5s ease-out forwards;
        }
        .avatar {
            width: 70px; height: 70px; background: #1a1a1a; color: #e8e825;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 700; margin: 0 auto 16px auto;
        }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        p.role { font-size: 11px; color: #6b6b64; letter-spacing: 0.5px; margin-bottom: 18px; }
        p.bio { font-size: 12px; line-height: 1.7; color: #444; margin-bottom: 22px; text-align: left; }
        .links a {
            display: inline-block; margin: 4px; padding: 8px 18px; background: #1a1a1a; color: #e8e825;
            text-decoration: none; font-size: 11px; letter-spacing: 0.5px; font-weight: 600;
            transition: background 0.15s ease;
        }
        .links a:hover { background: #333; }
        .back { margin-top: 22px; }
        .back a { color: #a0a09a; text-decoration: none; font-size: 11px; }
        .back a:hover { color: #1a1a1a; }
        @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="avatar">S</div>
        <h1>Hi, I'm Sakshi</h1>
        <p class="role">DATA SCIENTIST IN THE MAKING</p>
        <p class="bio">[Your bio goes here — a couple lines about who you are, what you're passionate about, and why you built this project.]</p>
        <div class="links">
            <a href="#">LinkedIn</a>
            <a href="#">GitHub</a>
            <a href="#">Portfolio</a>
        </div>
        <div class="back"><a href="javascript:history.back()">&larr; Go Back</a></div>
    </div>
</body>
</html>
